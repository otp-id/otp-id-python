[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otp-id"
version = "0.1.0"
description = "Official Python SDK for the OTP.ID V3 API"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PT Aplikasi Kreasi Indonesia (OTP.ID)" },
]
keywords = ["otp", "sms", "whatsapp", "email", "sdk", "otp.id"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/otp-id/otp-id-python"
Issues = "https://github.com/otp-id/otp-id-python/issues"
Documentation = "https://docs.otp.id"

[tool.hatch.build.targets.wheel]
packages = ["src/otpid"]
